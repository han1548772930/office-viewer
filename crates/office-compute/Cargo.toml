[package]
name = "office-compute"
version = "0.1.0"
edition = "2024"
publish = false
description = "Typed columnar computation kernels for the Office workbench"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
office-wasm-bridge = { path = "../office-wasm-bridge" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

