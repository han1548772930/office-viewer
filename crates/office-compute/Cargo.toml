[package]
name = "office-compute"
version = "0.1.0"
edition = "2024"
publish = false
description = "Typed columnar computation kernels for the Office workbench"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

