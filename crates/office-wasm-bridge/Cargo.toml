[package]
name = "office-wasm-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared Office WASM control, buffer leases, scheduling and browser hosts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "WorkerGlobalScope", "Document", "Node", "Element", "HtmlElement",
  "HtmlCanvasElement", "HtmlInputElement", "HtmlTextAreaElement",
  "CssStyleDeclaration", "Event", "EventTarget", "FocusOptions",
] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
