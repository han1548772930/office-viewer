[package]
name = "office-parser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
duke-pages = { version = "0.6.0", default-features = false }
rxls = { version = "0.1.4", default-features = false, features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
