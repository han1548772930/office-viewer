[package]
name = "office-parser"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
office-io-common = { path = "../office-io-common" }
office-wasm-bridge = { path = "../office-wasm-bridge" }
duke-pages = { version = "0.6.0", default-features = false }
rxls = { version = "0.1.4", default-features = false, features = ["full"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
office-writer = { path = "../office-writer" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
