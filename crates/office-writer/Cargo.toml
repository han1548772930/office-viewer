[package]
name = "office-writer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
office-io-common = { path = "../office-io-common" }
office-wasm-bridge = { path = "../office-wasm-bridge" }
base64 = "0.23.1"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ryu-js = "1.0.4"
wasm-bindgen = "0.2.130"
# ZIP entry timestamps use the portable DOS epoch. The optional `time` feature
# reads SystemTime in FileOptions::default(), which panics in browser WASM.
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen-futures = "0.4.80"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
