[package]
name = "office-writer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zip = { version = "2.6.1", default-features = false, features = ["deflate", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
