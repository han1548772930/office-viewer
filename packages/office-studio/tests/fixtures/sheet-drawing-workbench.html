    controls: json(slicerDrawingControls(value)), userId: studio().currentUserId,

}
function visiblePoint(geometry, local, requested) {
  const { rect, viewport, geometry: grid } = canvas()

    if (requested && (requested.frozenX !== undefined && layout.frozenX !== requested.frozenX || requested.frozenY !== undefined && layout.frozenY !== requested.frozenY)) continue

function point(kind, id, ratios = { x: 0.2, y: 0.2 }, requested) {
  const graph = drawingGraph(scene()), object = kind === 'group' ? graph.groups.get(id)?.frame : graph.objects.get(kind + ':' + id)?.geometry

}
function authorPoint(kind, handle, requested) {

      y: polygon.reduce((total, point) => total + point.y, 0) / polygon.length })).find(point => renderer.getTitleHit(chart.id, point)?.kind === 'title')
  } else {
