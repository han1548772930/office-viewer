<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Sparkline Workbench draft fixture</title>
<style>body{margin:0}#app{height:100vh}.sparkline-fixture-host{height:100%;display:flex;flex-direction:column}.sparkline-fixture-editor{flex:1;min-height:0}</style>
</head><body><div id="app"></div>
<script type="module">
import { createApp, h, nextTick, ref, shallowRef, watch } from 'vue'
import { ConfigProvider, theme } from 'antdv-next'
import { OfficeStudio } from '/packages/office-studio/src/api/office-studio.ts'
import { FOffice } from '/packages/office-studio/src/api/facade.ts'
import { WorkbenchDisplayKey } from '/packages/office-studio/src/platform/workbench-display.ts'
import { toExcelWorkbookView } from '/packages/office-studio/src/services/excelViewAdapter.ts'
import { SpreadsheetGeometry, GRID_HEADER_HEIGHT, GRID_HEADER_WIDTH } from '/packages/office-studio/src/rendering/spreadsheet/layout.ts'
import { createSpreadsheetScene } from '/packages/office-studio/src/rendering/spreadsheet/scene.ts'
import { readSparklineGroups } from '/packages/office-studio/src/features/sparkline/sparkline-model.ts'
import { parseSparklineReference } from '/packages/office-studio/src/features/sparkline/sparkline-reference.ts'
import { canViewProtectedRanges, canViewWorksheetProtection, createSheetRangeProtectionRule } from '/packages/office-studio/src/features/sheet-protection/range-protection.ts'
import ExcelWorkbench from '/packages/office-studio/src/components/ExcelWorkbench.vue'
import SparklinePanel from '/packages/office-studio/src/components/spreadsheet/SparklinePanel.vue'
import { sparklineCell, sparklineJson as json, sparklineWorkbook } from './sparkline-workbench-fixture.mjs'

// Deferred real Workbench/Pinia/Ant/Canvas2D/Facade fixture. It has not been served or opened.
// The separately controlled production panel lets drafts retain old input callbacks without mocking commands.
const slot = shallowRef(), view = ref(), dark = ref(false), variant = ref('classic'), display = ref({ chrome: 'full', zoom: 100 })
const controlled = ref({ open: false, workbookId: 'sparkline-book', sheetId: 'data', ranges: ['G1'] })
const commands = [], notices = [], panelEvents = [], callbacks = new Map()
let app, stopView
const studio = () => slot.value, book = () => FOffice.newAPI(studio()).getWorkbook(controlled.value.workbookId)
const model = () => studio().getWorkbookModel(book().getId()), sheet = () => book().getSheetBySheetId(model().activeSheetId)
async function settled() { await nextTick(); await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))); await nextTick() }
function canvas() {
  const root = document.querySelector('[role=grid][aria-label=工作表画布]'), scroller = document.querySelector('.canvas-scroll')
  if (!root || !scroller) throw new Error('No production Canvas host')
  const rect = root.getBoundingClientRect(), source = view.value.sheets.find(candidate => candidate.id === model().activeSheetId)
  return { root, rect, geometry: new SpreadsheetGeometry(source), viewport: { width: rect.width, height: rect.height,
    zoom: display.value.zoom / 100, scrollLeft: scroller.scrollLeft, scrollTop: scroller.scrollTop } }
}
function sourceReadable(source, range) {
  const original = model().sheets.find(candidate => candidate.id === source.id)
  return Boolean(original && canViewWorksheetProtection(original, studio().currentUserId) && canViewProtectedRanges(original, [range], studio().currentUserId))
}
function state() {
  const value = model(), history = studio().editor.history.units[value.id], grid = canvas()
  return { model: json(value), groups: json(readSparklineGroups(value.sheets.find(source => source.id === value.activeSheetId))),
    scene: json(createSpreadsheetScene(grid.geometry, grid.viewport, { activeCell: 'G1', selectedCells: [],
      sparklineContext: { sheets: view.value.sheets, canReadSource: sourceReadable } })),
    history: { undo: history?.undo.length ?? 0, redo: history?.redo.length ?? 0, generation: history?.generation,
      dirty: studio().editor.history.isDirty(value.id) }, revision: studio().getWorkbookRevision(value.id),
    commands: json(commands), notices: json(notices), panelEvents: json(panelEvents), userId: studio().currentUserId }
}
function seed(options) {
  const value = sparklineWorkbook(options), host = value.sheets[0]
  if (options.protectedMember) host.rangeProtectionRules = [createSheetRangeProtectionRule({ id: 'peer-member', permissionId: 'peer-member',
    editState: 'onlyMe', viewState: options.memberUnreadable ? 'noOneElseCanView' : 'othersCanView' },
    [parseSparklineReference('G2').range], 'peer')]
  return value
}
async function release() { app?.unmount(); app = undefined; stopView?.(); stopView = undefined; slot.value?.dispose(); slot.value = undefined; await settled() }
async function mount(options = {}) {
  await release(); commands.length = notices.length = panelEvents.length = 0
  dark.value = options.dark ?? false; variant.value = options.variant ?? 'classic'; display.value = { chrome: 'full', zoom: 100 }
  const value = options.model ?? seed(options)
  controlled.value = { open: false, workbookId: value.id, sheetId: 'data', ranges: ['G1'] }
  slot.value = new OfficeStudio({ workbook: value, currentUserId: options.currentUserId ?? 'local-user' }); view.value = toExcelWorkbookView(model())
  stopView = watch(() => slot.value?.editor.workbook.model, value => { if (value) view.value = toExcelWorkbookView(value) }, { flush: 'sync' })
  studio().events.addEvent('CommandExecuted', event => commands.push({ id: event.id, params: json(event.params ?? {}) }))
  app = createApp({ render: () => h(ConfigProvider, { theme: { algorithm: dark.value ? theme.darkAlgorithm : theme.defaultAlgorithm } }, {
    default: () => h('div', { class: 'sparkline-fixture-host' }, [
      h('div', { class: 'sparkline-fixture-editor' }, [h(ExcelWorkbench, { modelValue: view.value, studio: slot.value,
        ribbonVariant: variant.value, canUndo: studio().editor.canUndo, canRedo: studio().editor.canRedo,
        'onUpdate:modelValue': value => studio().editor.replaceWorkbookFromView(value, 'en-US'),
        onUndo: () => book().undo(), onRedo: () => book().redo(), onNotify: value => notices.push(json(value)) })]),
      h(SparklinePanel, { open: controlled.value.open, studio: slot.value, workbookId: controlled.value.workbookId,
        sheetId: controlled.value.sheetId, targetRange: controlled.value.ranges.join('; '), targetRanges: controlled.value.ranges,
        'onUpdate:open': value => { controlled.value = { ...controlled.value, open: value }; panelEvents.push(['open', value]) },
        onApplied: () => panelEvents.push(['applied']), onClosed: owner => panelEvents.push(['closed', owner?.target ?? null]) }),
    ]),
  }) }).use(studio().pinia).provide(WorkbenchDisplayKey, display)
  app.mount('#app'); await settled(); return state()
}
function cellRect(address) {
  const { range } = parseSparklineReference(address), grid = canvas()
  return { ...grid.geometry.cellRect(range.startRow, range.startCol, grid.viewport), left: grid.rect.left, top: grid.rect.top }
}
function point(address, kind = 'cell') {
  const rect = cellRect(address)
  return { x: rect.left + (kind === 'row' ? GRID_HEADER_WIDTH / 2 : rect.x + rect.width / 2),
    y: rect.top + (kind === 'column' ? GRID_HEADER_HEIGHT / 2 : rect.y + rect.height / 2) }
}
function pixels(address) {
  const grid = canvas(), rect = cellRect(address), surface = grid.root.querySelector('canvas'), context = surface?.getContext('2d')
  if (!context) throw new Error('Expected the real Canvas2D fallback')
  const size = surface.getBoundingClientRect(), scaleX = surface.width / size.width, scaleY = surface.height / size.height
  const data = context.getImageData(Math.floor((rect.x + 4) * scaleX), Math.floor((rect.y + 4) * scaleY),
    Math.max(1, Math.floor((rect.width - 8) * scaleX)), Math.max(1, Math.floor((rect.height - 8) * scaleY))).data
  let hash = 2166136261
  for (const byte of data) hash = Math.imul(hash ^ byte, 16777619)
  return { hash: hash >>> 0, bytes: data.length }
}
function captureCallback(label, key = 'onUpdate:value') {
  const element = document.querySelector(`[aria-label="${label}"]`)
  for (let component = element?.__vueParentComponent; component; component = component.parent) {
    const props = component.vnode.props ?? {}, callback = props[key]
    if (props['aria-label'] === label && typeof callback === 'function') {
      const id = `callback-${callbacks.size + 1}`; callbacks.set(id, callback); return id
    }
  }
  throw new Error('No production input callback found')
}
function captureAfterClose() {
  let callback
  function visit(node) {
    if (!node || typeof node !== 'object') return
    if (Array.isArray(node)) { node.forEach(visit); return }
    const props = node.props ?? {}, candidate = props.afterClose ?? props['after-close']
    if (typeof candidate === 'function' && typeof props.onCancel === 'function') callback = candidate
    if (node.component) visit(node.component.subTree)
    if (Array.isArray(node.children)) node.children.forEach(visit)
  }
  visit(app?._instance?.subTree)
  if (!callback) throw new Error('No production Modal close callback found')
  const id = `callback-${callbacks.size + 1}`; callbacks.set(id, callback); return id
}
window.sparklineFixture = { state, mount, point, pixels, captureCallback, captureAfterClose,
  async callback(id, value) { const callback = callbacks.get(id); if (!callback) throw new Error('No retained callback'); callback(value); await settled(); return state() },
  async openPanel(ranges = ['G1']) { controlled.value = { open: true, workbookId: model().id, sheetId: model().activeSheetId, ranges: [...ranges] }; await settled(); return state() },
  async select(ranges) { sheet().setActiveRangeList(ranges.map(range => sheet().getRange(range))); await settled(); return state() },
  async mutate(request) { sheet().applySparklineMutation(request); await settled(); return state() },
  async editCell(address, value, id = 'data') { book().getSheetBySheetId(id).getRange(address).setValue(value); await settled(); return state() },
  async switchSheet(id) { book().setActiveSheet(id); await settled(); return state() },
  async switchUser(userId) { return mount({ model: json(book().save()), currentUserId: userId }) },
  async clearHistory() { studio().editor.history.clear(book().getId()); await settled(); return state() },
  async appearance(value, layout = variant.value) { dark.value = value; variant.value = layout; await settled(); return state() },
  async zoom(value) { display.value = { ...display.value, zoom: value }; await settled(); return state() },
  async scroll(left, top) { const scroll = canvas().root.querySelector('.canvas-scroll') ?? document.querySelector('.canvas-scroll');
    scroll.scrollLeft = left; scroll.scrollTop = top; await settled(); return state() },
  async undo() { book().undo(); await settled(); return state() }, async redo() { book().redo(); await settled(); return state() },
  async reopen() { return mount({ model: json(book().save()), currentUserId: studio().currentUserId, dark: dark.value, variant: variant.value }) },
  async dispose() { await release(); callbacks.clear() },
}
await mount()
</script></body></html>
