<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Sheets cell shift fixture</title><style>body{margin:0}#app{height:100vh}</style></head>
<body><div id="app"></div><script type="module">
import { createApp, h, ref, watch } from 'vue'
import { ConfigProvider, theme } from 'antdv-next'
import { OfficeStudio } from '/packages/office-studio/src/api/office-studio'
import { FOffice } from '/packages/office-studio/src/api/facade'
import { createBlankSheet, createBlankWorkbook, createCell } from '/packages/office-studio/src/domain/model'
import { toExcelWorkbookView } from '/packages/office-studio/src/services/excelViewAdapter'
import ExcelWorkbench from '/packages/office-studio/src/components/ExcelWorkbench.vue'
const copy = value => JSON.parse(JSON.stringify(value)), model = createBlankWorkbook()
model.id = 'cell-shift-fixture'; model.name = '单元格移位'; model.calculationMode = 'manual'
model.sheets = ['Data', 'Report'].map((name, index) => ({ ...createBlankSheet(name), id: index ? 'report' : 'data',
  rowCount: 80, columnCount: 16, defaultRowHeight: 32, defaultColumnWidth: 130, defaultRowAutoHeight: false }))
model.activeSheetId = 'data'
model.sheets[0].cells['1:1'] = { ...createCell(1, 1, '移动内容'), authoredStyle: { font: { italic: true } }, metadata: { note: '保留批注' } }
model.sheets[0].cells['1:2'] = { ...createCell(1, 2, '其他列'), authoredStyle: {} }
model.sheets[1].cells['0:0'] = { ...createCell(0, 0, null), formula: '=Data!B2', authoredStyle: {} }
model.rangeThemes = { pattern: { name: 'pattern', headerRowStyle: { fill: '#123456' }, firstRowStyle: { fill: '#abcdef' }, secondRowStyle: { fill: '#fedcba' } } }
model.sheets[0].rangeThemeRules = [{ id: 'pattern', themeName: 'pattern', range: { startRow: 0, endRow: 5, startCol: 0, endCol: 3 } }]
const studio = new OfficeStudio({ workbook: model }), api = FOffice.newAPI(studio), dark = ref(false), variant = ref('classic'), notices = []
const view = ref(toExcelWorkbookView(studio.editor.workbook.model)), book = () => api.getActiveWorkbook()
watch(() => studio.editor.workbook.model, value => { view.value = toExcelWorkbookView(value) }, { flush: 'sync' })
window.cellShiftFixture = {
  snapshot: () => copy(studio.editor.workbook.model),
  history: () => { const history = studio.editor.history.units[studio.activeWorkbookId]; return { undo: history?.undo.length ?? 0, redo: history?.redo.length ?? 0 } },
  primary: () => studio.setSelections(book().getId(), 'data', [
    { startRow: 1, endRow: 1, startColumn: 1, endColumn: 1 }, { startRow: 5, endRow: 5, startColumn: 3, endColumn: 3 },
  ], { activeRangeIndex: 0 }),
  merge: () => studio.commitWorkbook(book().getId(), 'fixture merge', candidate => {
    candidate.sheets[0].mergedRanges = [{ startRow: 2, endRow: 3, startCol: 0, endCol: 2 }]
    candidate.sheets[0].cells['2:0'] = { ...createCell(2, 0, '合并来源'), authoredStyle: {} }
  }),
  newer: () => book().getActiveSheet().getRange('A10').setValue('较新内容'),
  protect: () => studio.commitWorkbook(book().getId(), 'fixture protection', candidate => {
    candidate.sheets[0].rangeProtectionRules = [{ id: 'tail', ranges: [{ startRow: 20, endRow: 20, startCol: 1, endCol: 1 }], allowedUserIds: ['owner'] }]
  }),
  filtered: () => studio.commitWorkbook(book().getId(), 'fixture filtered tail', candidate => {
    candidate.sheets[0].autoFilter = { range: { startRow: 0, endRow: 6, startCol: 0, endCol: 3 }, columns: {}, filteredRows: [5] }
  }),
  appearance: (value, layout = 'classic') => { dark.value = value; variant.value = layout },
  switchSheet: () => book().getSheetBySheetId('report').activate(),
  notifications: () => copy(notices),
}
createApp({ render: () => h(ConfigProvider, { theme: { algorithm: dark.value ? theme.darkAlgorithm : theme.defaultAlgorithm } }, {
  default: () => h(ExcelWorkbench, { modelValue: view.value, studio, ribbonVariant: variant.value,
    canUndo: studio.editor.canUndo, canRedo: studio.editor.canRedo,
    'onUpdate:modelValue': value => studio.editor.replaceWorkbookFromView(value, 'zh-CN'),
    onUndo: () => book().undo(), onRedo: () => book().redo(), onNotify: event => notices.push(copy(event)),
  }),
}) }).use(studio.pinia).mount('#app')
</script></body></html>
